model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  d_ff: 1344
  num_layers: 4
  num_heads: 16
  rope_theta: 10000

training:
  batch_size: 36
  learning_rate: 0.0003
  weight_decay: 0.1
  max_iters: 6001
  warmup_iters: 200
  max_grad_norm: 1.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

eval:
  eval_interval: 100
  eval_iters: 10
  checkingpoint_interval: 1000
